# Passive-setting evaluation of a GRPO checkpoint (LoRA adapter on Qwen2.5-VL-3B-Instruct).
# Set lora_path to your checkpoint, or pass --lora_path on the command line.
# The Active setting of GRPO checkpoints uses evaluation/run_active_grpo.py (see scripts/eval_grpo.sh).
backend: vllm
model: Qwen/Qwen2.5-VL-3B-Instruct
lora_path: checkpoints/grpo_qwen25vl_3b
enable_thinking: true
gpu_memory_utilization: 0.8
max_model_len: 16384
max_tokens: 4096
repetition_penalty: 1.05
